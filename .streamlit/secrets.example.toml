# Streamlit Cloud Secrets Configuration
# Copy this structure to your Streamlit Cloud app's secrets (not as a file)
# Go to: Your App > Settings > Secrets

[snowflake]
account = "your-account-identifier"
user = "your-username"
password = "your-password"
role = "ACCOUNTADMIN"
warehouse = "COMPUTE_WH"
database = "DOCUMENT_CHUNKS_DB"
schema = "public"

# Optional: Embedding model (defaults to 'e5-base-v2' if not specified)
# If you get region availability errors, enable cross-region inference in Snowflake
# embedding_model = "e5-base-v2"
